    <path d="M528.7 154.1L531.2 146.7L536.2 151.8Z"></path><path d="M546.5 136.9L538.9 139.2L544 144.4Z"></path>
    <path d="M471.3 209.9L468.8 217.3L463.8 212.2Z"></path><path d="M453.5 227.1L461.1 224.8L456 219.6Z"></path>
    <path d="M528.7 209.9L536.2 212.2L531.2 217.3Z"></path><path d="M546.5 227.1L544 219.6L538.9 224.8Z"></path>
  </g>

  <g filter="url(#shl)"><rect x="467" y="149" width="66" height="66" rx="17" mask="url(#tel)" style="fill:var(--primary,currentColor)"></rect></g>

  <g filter="url(#scl)"><circle cx="432" cy="116" r="26" fill="currentColor" fill-opacity=".04"></circle></g>
