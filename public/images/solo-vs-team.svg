  <g filter="url(#scl)"><circle cx="568" cy="116" r="26" fill="currentColor" fill-opacity=".04"></circle></g>
  <circle cx="568" cy="116" r="26" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1.4"></circle>
  <g transform="translate(568 116)" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="5.5"></circle><path d="M-9 10 C-9 1.5 9 1.5 9 10"></path></g>
  <g filter="url(#scl)"><circle cx="432" cy="248" r="26" fill="currentColor" fill-opacity=".04"></circle></g>
  <circle cx="432" cy="248" r="26" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1.4"></circle>
  <g transform="translate(432 248)" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="5.5"></circle><path d="M-9 10 C-9 1.5 9 1.5 9 10"></path></g>
  <g filter="url(#scl)"><circle cx="568" cy="248" r="26" fill="currentColor" fill-opacity=".04"></circle></g>
  <circle cx="568" cy="248" r="26" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1.4"></circle>
  <g transform="translate(568 248)" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="5.5"></circle><path d="M-9 10 C-9 1.5 9 1.5 9 10"></path></g>


  <g fill="currentColor" opacity=".62" font-size="14" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="153" y="320">Solo</text>
    <text x="500" y="320">Team</text>
