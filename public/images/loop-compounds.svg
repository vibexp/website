  <g fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1.4">
    <circle cx="240" cy="75" r="38"></circle>
    <circle cx="361.2" cy="285" r="38"></circle>
    <circle cx="118.8" cy="285" r="38"></circle>
  </g>


  <g transform="translate(240 75)" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-9 -12 H5 L10 -7 V12 H-9 Z"></path>
    <path d="M5 -12 V-7 H10"></path>
    <line x1="-5" y1="-2" x2="6" y2="-2"></line>
    <line x1="-5" y1="2" x2="6" y2="2"></line>
    <line x1="-5" y1="6" x2="2" y2="6"></line>
  </g>

  <path transform="translate(361.2 285)" d="M0 -11 C1.5 -4.5 4.5 -1.5 11 0 C4.5 1.5 1.5 4.5 0 11 C-1.5 4.5 -4.5 1.5 -11 0 C-4.5 -1.5 -1.5 -4.5 0 -11 Z" fill="currentColor"></path>

