<svg viewBox="0 0 480 420" style="width:100%;height:auto" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tl dl">
  <title id="tl">How VibeXP compounds: your AI reads your knowledge, does the work, and writes back what it learns.</title>
  <desc id="dl">A closed clockwise loop of three stages — Read, Work, Write back — circling a central VibeXP knowledge base. Growing rings around the centre show the knowledge compounding so each cycle starts smarter than the last.</desc>
  <defs>
    <filter id="ccl" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity=".07"></feDropShadow></filter>
    <filter id="chl" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#000000" flood-opacity=".22"></feDropShadow></filter>
    <mask id="cml" maskUnits="userSpaceOnUse" x="211" y="189" width="58" height="52">
      <rect x="211" y="189" width="58" height="52" rx="15" fill="#ffffff"></rect>
      <svg x="219" y="201" width="42" height="33" viewBox="118 150 276 212" overflow="visible"><path d="M128 256h48l32-96 64 192 32-96h48" fill="none" stroke="#000000" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </mask>
  </defs>


  <g fill="none" stroke="currentColor">
    <circle cx="240" cy="215" r="46" stroke-opacity=".16"></circle>
    <circle cx="240" cy="215" r="68" stroke-opacity=".09"></circle>
    <circle cx="240" cy="215" r="92" stroke-opacity=".045"></circle>
  </g>


  <g fill="none" stroke-width="2.4" stroke-linecap="round" style="stroke:var(--primary,currentColor)">
    <path d="M262 113.1Q349 147.8 337.2 243.4"></path>
    <path d="M317.2 285Q243.7 343 166.8 285"></path>
    <path d="M140.8 246.9Q127.4 154.2 216 116.6"></path>
  </g>
  <g style="fill:var(--primary,currentColor)">
    <path d="M337.2 243.4L333.5 232.9L343.4 234.1Z"></path>
    <path d="M166.8 285L177.8 287L171.8 295Z"></path>
    <path d="M216 116.6L208.8 125.1L204.8 115.9Z"></path>
  </g>


  <g filter="url(#chl)"><rect x="211" y="189" width="58" height="52" rx="15" mask="url(#cml)" style="fill:var(--primary,currentColor)"></rect></g>


  <g filter="url(#ccl)">
    <circle cx="240" cy="75" r="38" fill="currentColor" fill-opacity=".04"></circle>
    <circle cx="361.2" cy="285" r="38" fill="currentColor" fill-opacity=".04"></circle>
    <circle cx="118.8" cy="285" r="38" fill="currentColor" fill-opacity=".04"></circle>
