name: Site check

# Builds the site on every pull request, type-checks it, and checks every
# internal link in the output.
#
# The link check earns its place here more than it would on most sites. The
# pages under docs/ are written to be read on GitHub, so they cross-link by
# relative path and heading anchor (`memory.md#semantic-search`), and
# scripts/sync-docs.mjs rewrites those into site routes at build time. The
# landing FAQ and features.config.mjs deep-link into the docs the same way.
# Renaming a heading, moving a file, or adding a page without listing it in
# docs.manifest.mjs all break links that still render as perfectly ordinary
# text.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Type check
        run: npm run check

      - name: Check links
        run: npm run check:links

  # SonarCloud, kept from the previous site's CI. Non-blocking: a SonarCloud
  # outage or a missing token never fails a pull request. It is the one
  # non-GitHub action in this repository's workflows, pinned by SHA like the
  # rest. Config lives in sonar-project.properties.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud attributes new code and blame accurately.
          fetch-depth: 0

      - name: SonarCloud scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
