name: CI

# Pull-request checks for the website. The design-system is consumed from the
# public npm registry, so no auth token is required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Non-blocking SonarCloud (SonarQube) analysis with Jest coverage. Runs on
  # every PR and push to main, but the scan step is continue-on-error so a red
  # Quality Gate never blocks a merge while existing debt is burned down.
  # Requires SonarCloud "Automatic Analysis" to be disabled for vibexp_website
  # (mutually exclusive with CI analysis). Config lives in sonar-project.properties.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SonarCloud attributes new-code and blame accurately.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: SonarCloud scan
        uses: sonarsource/sonarqube-scan-action@v8.2.1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
