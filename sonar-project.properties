# SonarCloud analysis for vibexp.io (website, docs tooling and blog).
#
# Driven from the non-blocking `sonar` job in .github/workflows/site-check.yml.
# CI analysis and SonarCloud "Automatic Analysis" are mutually exclusive, so
# Automatic Analysis must stay disabled for the vibexp_website project
# (SonarCloud -> Administration -> Analysis Method) or scans are rejected.
sonar.organization=vibexp
sonar.projectKey=vibexp_website

# The site's own code: pages, components, styles, build scripts and the config
# modules at the root. The Markdown under docs/ and src/content/ is content,
# not code. There are no unit tests, so no coverage report is read.
sonar.sources=src,scripts,astro.config.mjs,site.config.mjs,docs.manifest.mjs,faq.config.mjs,features.config.mjs
sonar.exclusions=dist/**,.astro/**,src/content/**,src/data/**
