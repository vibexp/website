# SonarCloud (SonarQube) analysis for the VibeXP marketing website.
#
# This drives CI-based analysis from .github/workflows/ci.yml. CI analysis and
# SonarCloud "Automatic Analysis" are mutually exclusive, so Automatic Analysis
# must be disabled for the vibexp_website project (SonarCloud → Administration →
# Analysis Method) or scans are rejected.
sonar.organization=vibexp
sonar.projectKey=vibexp_website

# Analyse application source only; tests live under tests/ and drive coverage.
sonar.sources=src

# Jest coverage report (npm run test:coverage → coverage/lcov.info). Paths in the
# lcov are already repo-relative (src/...) since jest runs at the repo root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep build output and test files out of analysis.
sonar.exclusions=dist/**,.astro/**,**/*.test.*,**/*.spec.*
